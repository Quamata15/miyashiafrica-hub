# Test environment: replays the migrations and deploys the edge functions on the staging
# Supabase project, then runs the SQL scenarios there. Production is never touched.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access tokens).
name: Staging
on:
  workflow_dispatch:
  push:
    branches: [miyashi-supabase-fedapay]
    paths: ["supabase/**", "scripts/**", ".github/workflows/staging.yml"]
concurrency: { group: staging, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: brflszgaqoketsvyyluv
    steps:
      - uses: actions/checkout@v4
      - name: Check the token
        run: if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::Ajoutez le secret SUPABASE_ACCESS_TOKEN pour activer l'environnement de test"; exit 0; fi
      - name: Migrations
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: scripts/staging-sync.sh
      - uses: supabase/setup-cli@v1
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        with: { version: latest }
      - name: Edge functions
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: SQL scenarios
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: scripts/db-test.sh
